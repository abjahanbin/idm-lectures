<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 06</title>
</head>
<body>
  <div class="reveal">
    <div class="slides">

      <!-- ============================================================ -->
      <!-- MOVEMENT 1 — (title)                                          -->
      <!-- ============================================================ -->

      <!-- 1. Title slide (movement 1's divider). No data-movement-name
           here on purpose, same as week01/week02/week04 — the bar's
           movement label only starts showing from slide 2 onward. No
           data-bg override yet — defaults to the deck-wide voronoi
           texture until this week's topic points to something more
           on-theme. -->
      <section class="impact-slide divider" data-movement="1">
        <div class="impact-inner">
          <h1>Interactive Digital Media</h1>
          <p class="impact-byline">Week 06</p>
        </div>
      </section>

      <!-- 2. "Shaders" recap — last session's topic, a quick term-highlight
           callback before this week's own material starts. Same treatment
           as the "Audio Synthesis" term slide below, plus a small
           "last session" byline underneath. -->
      <section class="impact-slide" data-movement="1" data-movement-name="Recap" style="--divider-color: var(--accent-blue);">
        <div class="impact-inner">
          <h3 class="title-highlight">Shaders</h3>
          <p class="impact-byline">last session</p>
        </div>
      </section>

      <!-- 3-5. Student work — same full-viewport clip-layer pattern as
           week04 slides 9-15: a local video (or, for the third, a YouTube
           embed) fills the screen at its own proportions, with the
           student's name tagged in the top-left corner (see
           #clip-layer/#clip-caption in theme.css, wired up in main.js).
           The first two are muted/looping local files in
           assets/studentwork (re-encoded from the original ~20 Mbps
           captures down to ~4-5 Mbps, matching the rest of this deck's
           video assets and small enough to push to git); the third
           reuses the deck's existing data-background-iframe convention
           (see week01) instead of a local file, with mute+loop+playlist
           params so a single YouTube video autoplays and loops silently
           just like its local-file neighbors. -->
      <section data-movement="1" data-movement-name="Recap" data-clip-file="IlianaMaristela.mp4" data-clip-name="Iliana Maristela"></section>

      <section data-movement="1" data-movement-name="Recap" data-clip-file="SydneyGarramone.mp4" data-clip-name="Sydney Garramone"></section>

      <section
        data-movement="1"
        data-movement-name="Recap"
        data-clip-name="Leann Bernard"
        data-background-iframe="https://www.youtube.com/embed/GbFnZIILnwM?autoplay=1&mute=1&loop=1&playlist=GbFnZIILnwM&rel=0"
      ></section>

      <!-- 6. "Audio Synthesis" — the week's core term, same treatment as
           week02's "Emergence" / week04's "Shaders" (plain impact-slide,
           no WebGL divider background). -->
      <section class="impact-slide" data-movement="1" data-movement-name="Audio Synthesis" style="--divider-color: var(--accent-blue);">
        <div class="impact-inner">
          <h3 class="title-highlight">Audio Synthesis</h3>
        </div>
      </section>

      <!-- 7. Sound demo — same structure as the Oscillator demo below,
           but the source is a recorded file rather than a synthesized
           tone (see initAudioFileDemo in shared/audio-demo.js). Live
           waveform visualizer shows the file's actual decoded output,
           not a canned/precomputed waveform. -->
      <section class="impact-slide" data-movement="1" data-movement-name="Audio Synthesis">
        <div class="impact-inner">
          <h2>Sound</h2>
          <div class="audio-demo" id="sound-demo-1" style="--divider-color: var(--accent-blue);">
            <canvas class="wave-canvas" data-role="wave"></canvas>
            <button class="play-button" data-role="play" aria-label="Play"></button>
          </div>
        </div>
      </section>

      <!-- 8. Noise demo — same barebones structure as the Oscillator demo
           below (one play/stop button, one scope, no other controls), but
           the source is genuine white noise — independently-random
           samples, not a formula with any repeating shape (see
           initNoiseDemo in shared/audio-demo.js). The scope trace should
           look like a dense, structureless scribble with no steady cycle,
           unlike every tone-based demo around it. -->
      <section class="impact-slide" data-movement="1" data-movement-name="Audio Synthesis">
        <div class="impact-inner">
          <h2>Noise</h2>
          <div class="audio-demo" id="noise-demo-1" style="--divider-color: var(--accent-blue);">
            <canvas class="wave-canvas" data-role="wave"></canvas>
            <button class="play-button" data-role="play" aria-label="Play"></button>
          </div>
        </div>
      </section>

      <!-- 9. Oscillator demo — barebones: one play/stop button + a live
           waveform visualizer built on AnalyserNode (see
           shared/audio-demo.js, wired up in main.js). More layers
           (amplitude control, other waveform shapes, etc.) added on
           later slides. -->
      <section class="impact-slide" data-movement="1" data-movement-name="Audio Synthesis">
        <div class="impact-inner">
          <h2>Oscillator</h2>
          <div class="audio-demo" id="osc-demo-1" style="--divider-color: var(--accent-blue);">
            <canvas class="wave-canvas" data-role="wave"></canvas>
            <button class="play-button" data-role="play" aria-label="Play"></button>
          </div>
        </div>
      </section>

      <!-- 10. Frequency demo — same structure as the Oscillator demo, plus
           a logarithmic frequency slider under the visualizer (see
           initFrequencyDemo in shared/audio-demo.js). Sweeping the
           slider while playing squeezes more wave cycles into the same
           fixed-width visualizer as pitch rises. -->
      <section class="impact-slide" data-movement="1" data-movement-name="Audio Synthesis">
        <div class="impact-inner">
          <h2>Frequency</h2>
          <div class="audio-demo" id="freq-demo-1" style="--divider-color: var(--accent-blue);">
            <canvas class="wave-canvas" data-role="wave"></canvas>
            <div class="freq-control">
              <input type="range" class="freq-slider" data-role="freq-slider" />
              <span class="freq-value" data-role="freq-value"></span>
            </div>
            <button class="play-button" data-role="play" aria-label="Play"></button>
          </div>
        </div>
      </section>

      <!-- 11. Amplitude demo — same structure as the Frequency demo (and
           keeps its frequency slider), plus a vertical volume fader
           beside the visualizer (see initFrequencyDemo's optional
           volume-slider handling in shared/audio-demo.js). Gain is
           applied before the analyser in the signal chain, so raising it
           makes the drawn wave taller without changing its shape. -->
      <section class="impact-slide" data-movement="1" data-movement-name="Audio Synthesis">
        <div class="impact-inner">
          <h2>Amplitude</h2>
          <div class="audio-demo" id="amp-demo-1" style="--divider-color: var(--accent-blue);">
            <div class="wave-row">
              <canvas class="wave-canvas" data-role="wave"></canvas>
              <div class="volume-control">
                <input type="range" class="volume-slider" data-role="volume-slider" />
              </div>
            </div>
            <div class="freq-control">
              <input type="range" class="freq-slider" data-role="freq-slider" />
              <span class="freq-value" data-role="freq-value"></span>
            </div>
            <button class="play-button" data-role="play" aria-label="Play"></button>
          </div>
        </div>
      </section>

      <!-- 12. Waveform demo — same structure as the Amplitude demo (keeps
           the frequency slider and volume fader), plus four icon-only
           waveform-select buttons stacked on the left of the visualizer
           (see initFrequencyDemo's optional waveform-button handling in
           shared/audio-demo.js). Switching waveform while playing
           changes osc.type live — same pitch/volume, different shape
           and timbre. -->
      <section class="impact-slide" data-movement="1" data-movement-name="Audio Synthesis">
        <div class="impact-inner">
          <h2>Waveform</h2>
          <div class="audio-demo" id="waveform-demo-1" style="--divider-color: var(--accent-blue);">
            <div class="wave-row">
              <div class="waveform-buttons">
                <button class="waveform-button" data-role="waveform-button" data-waveform="sine" aria-label="Sine"></button>
                <button class="waveform-button" data-role="waveform-button" data-waveform="square" aria-label="Square"></button>
                <button class="waveform-button" data-role="waveform-button" data-waveform="sawtooth" aria-label="Sawtooth"></button>
                <button class="waveform-button" data-role="waveform-button" data-waveform="triangle" aria-label="Triangle"></button>
              </div>
              <canvas class="wave-canvas" data-role="wave"></canvas>
              <div class="volume-control">
                <input type="range" class="volume-slider" data-role="volume-slider" />
              </div>
            </div>
            <div class="freq-control">
              <input type="range" class="freq-slider" data-role="freq-slider" />
              <span class="freq-value" data-role="freq-value"></span>
            </div>
            <button class="play-button" data-role="play" aria-label="Play"></button>
          </div>
        </div>
      </section>

      <!-- 13. Spectrum demo — same structure and waveform buttons as the
           Waveform demo, plus a bar-graph spectrum view next to the
           scope (see the spectrum handling in createDemoUI, shared/
           audio-demo.js). Bars are read from real FFT data, one per
           harmonic of the fundamental — sine lights only the first bar,
           square lights every other one (real waveforms only have odd
           harmonics), sawtooth lights all of them (it has every
           harmonic). No per-waveform special-casing needed for that —
           it's what the actual signal's harmonic content is. -->
      <section class="impact-slide" data-movement="1" data-movement-name="Audio Synthesis">
        <div class="impact-inner">
          <h2>Spectrum</h2>
          <div class="audio-demo" id="spectrum-demo-1" style="--divider-color: var(--accent-blue);">
            <div class="wave-row">
              <div class="waveform-buttons">
                <button class="waveform-button" data-role="waveform-button" data-waveform="sine" aria-label="Sine"></button>
                <button class="waveform-button" data-role="waveform-button" data-waveform="square" aria-label="Square"></button>
                <button class="waveform-button" data-role="waveform-button" data-waveform="sawtooth" aria-label="Sawtooth"></button>
                <button class="waveform-button" data-role="waveform-button" data-waveform="triangle" aria-label="Triangle"></button>
              </div>
              <canvas class="wave-canvas" data-role="wave"></canvas>
              <canvas class="spectrum-canvas" data-role="spectrum"></canvas>
              <div class="volume-control">
                <input type="range" class="volume-slider" data-role="volume-slider" />
              </div>
            </div>
            <div class="freq-control">
              <input type="range" class="freq-slider" data-role="freq-slider" />
              <span class="freq-value" data-role="freq-value"></span>
            </div>
            <button class="play-button" data-role="play" aria-label="Play"></button>
          </div>
        </div>
      </section>

      <!-- 14. Harmonics demo — same scope+spectrum+volume-fader structure
           as the Spectrum demo, but the waveform buttons are replaced
           with a single continuous morph slider (see initHarmonicsDemo
           in shared/audio-demo.js). Sine, square, sawtooth, and triangle
           sit at fixed points along it; every value between them is a
           genuinely-computed in-between waveform (built from blended
           Fourier coefficients into a custom PeriodicWave), not a
           crossfade of two signals playing at once — so the spectrum
           bars actually fade harmonics in and out continuously as it
           moves, rather than jumping between four fixed patterns. -->
      <section class="impact-slide" data-movement="1" data-movement-name="Audio Synthesis">
        <div class="impact-inner">
          <h2>Harmonics</h2>
          <div class="audio-demo" id="harmonics-demo-1" style="--divider-color: var(--accent-blue);">
            <div class="wave-row">
              <div class="harmonics-control">
                <input type="range" class="harmonics-slider" data-role="harmonics-slider" />
              </div>
              <canvas class="wave-canvas" data-role="wave"></canvas>
              <canvas class="spectrum-canvas" data-role="spectrum"></canvas>
              <div class="volume-control">
                <input type="range" class="volume-slider" data-role="volume-slider" />
              </div>
            </div>
            <div class="freq-control">
              <input type="range" class="freq-slider" data-role="freq-slider" />
              <span class="freq-value" data-role="freq-value"></span>
            </div>
            <button class="play-button" data-role="play" aria-label="Play"></button>
          </div>
        </div>
      </section>

      <!-- 15. Filter demo — a single oscillator (any of the four classic
           shapes, via the same waveform-select buttons as the Waveform/
           Spectrum slides) through a lowpass filter, controlled by one
           XY touchpad instead of two sliders: the X axis sweeps cutoff
           frequency (log scale, 100–10,000 Hz, same feel as the other
           frequency sliders), the Y axis sweeps resonance (the filter's
           Q) — up for more. Dragging is a much more direct, "playable"
           way to feel how cutoff and resonance interact than two
           independent sliders would be (see initFilterDemo in
           shared/audio-demo.js). -->
      <section class="impact-slide" data-movement="1" data-movement-name="Audio Synthesis">
        <div class="impact-inner">
          <h2>Filter</h2>
          <div class="audio-demo" id="filter-demo-1" style="--divider-color: var(--accent-blue);">
            <div class="wave-row">
              <div class="waveform-buttons">
                <button class="waveform-button" data-role="waveform-button" data-waveform="sine" aria-label="Sine"></button>
                <button class="waveform-button" data-role="waveform-button" data-waveform="square" aria-label="Square"></button>
                <button class="waveform-button" data-role="waveform-button" data-waveform="sawtooth" aria-label="Sawtooth"></button>
                <button class="waveform-button" data-role="waveform-button" data-waveform="triangle" aria-label="Triangle"></button>
              </div>
              <canvas class="wave-canvas" data-role="wave"></canvas>
              <div class="filter-control">
                <div class="xy-pad" data-role="xy-pad">
                  <div class="xy-pad-handle" data-role="xy-handle"></div>
                </div>
                <span class="xy-readout">
                  <span class="xy-readout-hz" data-role="filter-hz"></span> Hz · Q
                  <span class="xy-readout-q" data-role="filter-q"></span>
                </span>
              </div>
            </div>
            <button class="play-button" data-role="play" aria-label="Play"></button>
          </div>
        </div>
      </section>

      <!-- 16. Envelope demo — a single oscillator's amplitude shaped by
           an ADSR (Attack/Decay/Sustain/Release) envelope, edited by
           dragging its curve directly rather than via separate sliders:
           the attack peak (time only), the decay/sustain corner (time +
           level, one handle for two parameters), and the release end
           (time only). Play triggers attack→decay→sustain (held
           indefinitely); Stop triggers the release ramp from wherever
           the envelope currently is (see initEnvelopeDemo in
           shared/audio-demo.js). -->
      <section class="impact-slide" data-movement="1" data-movement-name="Audio Synthesis">
        <div class="impact-inner">
          <h2>Envelope</h2>
          <div class="audio-demo" id="envelope-demo-1" style="--divider-color: var(--accent-blue);">
            <canvas class="wave-canvas envelope-canvas" data-role="wave"></canvas>
            <button class="play-button" data-role="play" aria-label="Play"></button>
          </div>
        </div>
      </section>

      <!-- 17. LFO demo — a slow oscillator (0.1–20 Hz) modulates one of
           three targets on a second, audible oscillator: pitch
           (vibrato), amplitude (tremolo), or a lowpass filter's cutoff
           (auto-wah) — the same three parameters already explored by
           hand on the Frequency/Amplitude/Filter slides, now moved
           automatically instead. Rate and Depth reuse this deck's
           existing frequency-slider/volume-fader styling; Target reuses
           the waveform-select buttons' look (see initLfoDemo in
           shared/audio-demo.js). -->
      <section class="impact-slide" data-movement="1" data-movement-name="Audio Synthesis">
        <div class="impact-inner">
          <h2>LFO</h2>
          <div class="audio-demo" id="lfo-demo-1" style="--divider-color: var(--accent-blue);">
            <div class="wave-row">
              <div class="waveform-buttons">
                <button class="waveform-button target-button" data-role="target-button" data-target="pitch" aria-label="Pitch"></button>
                <button class="waveform-button target-button" data-role="target-button" data-target="amplitude" aria-label="Amplitude"></button>
                <button class="waveform-button target-button" data-role="target-button" data-target="filter" aria-label="Filter"></button>
              </div>
              <canvas class="wave-canvas" data-role="wave"></canvas>
              <div class="volume-control">
                <input type="range" class="volume-slider" data-role="depth-slider" />
              </div>
            </div>
            <div class="freq-control">
              <input type="range" class="freq-slider" data-role="rate-slider" />
              <span class="freq-value" data-role="rate-value"></span>
            </div>
            <button class="play-button" data-role="play" aria-label="Play"></button>
          </div>
        </div>
      </section>

      <!-- ============================================================ -->
      <!-- MOVEMENT 2 — MetaSounds                                       -->
      <!-- ============================================================ -->

      <!-- 18. "MetaSounds" title (movement 2's divider). Bar color
           changes automatically from here — colorForMovement() in
           reveal-init.js cycles by movement number, so data-movement="2"
           alone switches the bar's fill to the palette's 2nd color
           (blue). --divider-color set to match, same convention used for
           every other week's movement 2 divider. -->
      <section class="impact-slide divider" data-movement="2" data-movement-name="MetaSounds" style="--divider-color: var(--accent-blue);">
        <div class="impact-inner">
          <h2>MetaSounds</h2>
        </div>
      </section>

      <!-- 19-32. MetaSounds screenshots, one per slide, in order. Bare
           marker sections — same convention as week04 slides 17+ — the
           actual image lives in the shared full-viewport
           #screenshot-layer (see theme.css and initScreenshots() in
           main.js). -->
      <section data-movement="2" data-movement-name="MetaSounds" data-screenshot-file="IDM_Capture 428.jpg"></section>
      <section data-movement="2" data-movement-name="MetaSounds" data-screenshot-file="IDM_Capture 429.jpg"></section>
      <section data-movement="2" data-movement-name="MetaSounds" data-screenshot-file="IDM_Capture 430.jpg"></section>
      <section data-movement="2" data-movement-name="MetaSounds" data-screenshot-file="IDM_Capture 431.jpg"></section>
      <section data-movement="2" data-movement-name="MetaSounds" data-screenshot-file="IDM_Capture 432.jpg"></section>
      <section data-movement="2" data-movement-name="MetaSounds" data-screenshot-file="IDM_Capture 434.jpg"></section>
      <section data-movement="2" data-movement-name="MetaSounds" data-screenshot-file="IDM_Capture 435.jpg"></section>
      <section data-movement="2" data-movement-name="MetaSounds" data-screenshot-file="IDM_Capture 436.jpg"></section>
      <section data-movement="2" data-movement-name="MetaSounds" data-screenshot-file="IDM_Capture 439.jpg"></section>
      <section data-movement="2" data-movement-name="MetaSounds" data-screenshot-file="IDM_Capture 440.jpg"></section>
      <section data-movement="2" data-movement-name="MetaSounds" data-screenshot-file="IDM_Capture 441.jpg"></section>
      <section data-movement="2" data-movement-name="MetaSounds" data-screenshot-file="IDM_Capture 442.jpg"></section>
      <section data-movement="2" data-movement-name="MetaSounds" data-screenshot-file="IDM_Capture 443.jpg"></section>
      <section data-movement="2" data-movement-name="MetaSounds" data-screenshot-file="IDM_Capture 445.jpg"></section>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
