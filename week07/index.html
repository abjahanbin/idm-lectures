      <section class="impact-slide divider" data-movement="1">

          <h1>Interactive Digital Media</h1>
          <p class="impact-byline">Week 07</p>
        </div>
      </section>

        <div class="impact-inner">
          <h3 class="title-highlight">MetaSounds</h3>
          <p class="impact-byline">last session</p>
        </div>
      </section>

      <!-- 3-8. Student work — same full-viewport clip-layer pattern as
           week06 slides 3/4: a local video fills the screen at its own
           proportions, with the student's name (taken from the end of
           each file name) tagged in the top-left corner (see
           #clip-layer/#clip-caption in theme.css, wired up in main.js). -->

      <!-- 9. "Generative and Systems Music" — this week's core term, same
           treatment as week06's "Audio Synthesis"/"MetaSounds" term
           slides (plain impact-slide, no WebGL/Voronoi divider
           background). -->
      <section class="impact-slide" data-movement="1" data-movement-name="Generative and Systems Music" style="--divider-color: var(--accent-blue);">
        <div class="impact-inner">
          <h3 class="title-highlight">Generative and Systems Music</h3>
        </div>
      </section>

      <!-- 10. YouTube embed, same data-background-iframe convention as
           week01 — autoplay with audio (no mute param), starting from
           the beginning (no start= param needed, that's the default). -->
      <section
        data-movement="1"
        data-movement-name="Generative and Systems Music"
        data-background-iframe="https://www.youtube.com/embed/n0njBFLQSk8?autoplay=1&rel=0"
        data-background-interactive
      ></section>

      <!-- 11. Second YouTube embed, same convention as slide 10. -->

        data-movement="1"
        data-movement-name="Generative and Systems Music"
        data-background-iframe="https://www.youtube.com/embed/Aucni2q_bZQ?autoplay=1&rel=0"
        data-background-interactive

      <!-- 12. Third YouTube embed, same convention as slide 10. -->

        data-movement="1"
        data-movement-name="Generative and Systems Music"
        data-background-iframe="https://www.youtube.com/embed/LKZ3fGR2SDY?autoplay=1&rel=0"
        data-background-interactive
      ></section>

      <!-- 13. Fourth YouTube embed, starts at 6:50 (472s) via the start=
           param, same convention as slide 10 otherwise. -->
      <section
        data-movement="1"
        data-movement-name="Generative and Systems Music"
        data-background-iframe="https://www.youtube.com/embed/Df5Y7k_koUI?autoplay=1&start=472&rel=0"
        data-background-interactive
      ></section>

      <!-- 14. "Unreal Engine" — new term slide, same treatment as the
           "Generative and Systems Music" term slide above (plain
           impact-slide, no WebGL/Voronoi divider background). -->

        <div class="impact-inner">

      </section>
