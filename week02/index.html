<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week 02</title>
</head>
<body>
  <div class="reveal">
    <div class="slides">

      <!-- ============================================================ -->
      <!-- MOVEMENT 1 — (title)                                          -->
      <!-- ============================================================ -->

      <!-- 1. Title slide (movement 1's divider). No data-movement-name
           here on purpose, same as week01 — the bar's movement label
           only starts showing from slide 2 onward. data-bg swaps the
           default voronoi texture for the Rule 30 cellular-automaton
           background, on theme for this week's emergence topic. -->
      <section class="impact-slide divider" data-movement="1" data-bg="rule30">
        <div class="impact-inner">
          <h1>Interactive Digital Media</h1>
          <p class="impact-byline">Week 02</p>
        </div>
      </section>

      <!-- 2. Embedded video, full-bleed background iframe, autoplay with
           audio (no mute param) — same pattern as week01's video slides. -->
      <section
        data-movement="1"
        data-movement-name="Introduction"
        data-background-iframe="https://www.youtube.com/embed/V4f_1_r80RY?autoplay=1&rel=0"
        data-background-interactive
      ></section>

      <!-- 3. "Emergence" — the core term, highlighted the same way as
           week01's Project 1/2/3 headings (plain impact-slide, no
           WebGL divider background). Definition sits on a breakout
           slide below it, hung on screen the same way as the
           discussion/provocation impact-statement slides. -->
      <section data-movement="1" data-movement-name="Introduction">
        <section class="impact-slide" style="--divider-color: var(--accent-green);">
          <div class="impact-inner">
            <h3 class="title-highlight">Emergence</h3>
          </div>
        </section>

        <!-- 3a. Definition breakout. &nbsp; at the two spots prone to
             stranding a word on its own line — same fix as week01 slide
             29's orphaned "to?" — rather than a forced <br>, which just
             traded that problem for an awkwardly short standalone line. -->
        <section class="impact-slide">
          <div class="impact-inner">
            <p class="impact-statement">Individual agents follow simple local&nbsp;rules, and a coherent global pattern appears that none of the individual agents&nbsp;see.</p>
          </div>
        </section>
      </section>

      <!-- 5. Embedded video, full-bleed background iframe, autoplay with
           audio (no mute param) — same pattern as slide 2. -->
      <section
        data-movement="1"
        data-movement-name="Introduction"
        data-background-iframe="https://www.youtube.com/embed/tEjwc_Xprxg?autoplay=1&rel=0"
        data-background-interactive

      <!-- 11. Boids algorithm diagram. Same photo-figure/photo-caption
           pattern as week01's Oram/DAW photo slides — image set in
           main.js via new URL(..., import.meta.url) with its real
           aspect ratio, not hardcoded in CSS. -->

        <div class="impact-inner">
          <div class="photo-figure">
